version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: finsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
      POSTGRES_USER: ${POSTGRES_USER:-finsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsight}
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: finsight-redis
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: finsight-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: finsight-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend:
    image: ghcr.io/${REPO_OWNER}/finsight-backend:${IMAGE_TAG:-latest}
    container_name: finsight-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - kafka
      - ai-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finsight}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finsight}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finsight}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_SERVICE_BASE_URL: http://ai-service:8001
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "8080:8080"

  ai-service:
    image: ghcr.io/${REPO_OWNER}/finsight-ai-service:${IMAGE_TAG:-latest}
    container_name: finsight-ai-service
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8001:8001"

  frontend:
    image: ghcr.io/${REPO_OWNER}/finsight-frontend:${IMAGE_TAG:-latest}
    container_name: finsight-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: finsight-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    container_name: finsight-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
