spring:
  application:
    name: finsight-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finsight}
    username: ${SPRING_DATASOURCE_USERNAME:finsight}
    password: ${SPRING_DATASOURCE_PASSWORD:finsight}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: finsight-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring:
        json:
          trusted:
            packages: "com.finsight.platform.events.model"

  cache:
    type: redis

app:
  security:
    jwt:
      secret: ${APP_JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItanVsdC1zaWduaW5nLTMyLWJ5dGVzLXBsdXM=}
      access-token-minutes: 30
      refresh-token-days: 7
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
  kafka:
    topics:
      incident-created: incident.created.v1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.finsight.platform: INFO
