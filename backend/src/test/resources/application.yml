spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finsight
    username: finsight
    password: finsight

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: finsight-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring:
        json:
          trusted:
            packages: "com.finsight.platform.events.model"

  cache:
    type: redis

app:
  security:
    jwt:
      secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMzItYnl0ZXM=
      access-token-minutes: 30
      refresh-token-days: 7
  ai:
    base-url: http://localhost:8001
  kafka:
    topics:
      incident-created: incident.created.v1
